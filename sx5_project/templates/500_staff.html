<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Error (500)</title>
  <style>
    body { margin: 0; padding: 24px 16px; background: #fdfaf3; color: #1f2a24;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .request { color: #5b6660; margin: 0 0 20px; }
    .error { background: #fbe9e7; border-left: 4px solid #c0392b; padding: 12px 16px;
             margin: 0 0 20px; overflow-wrap: anywhere; }
    .error strong { display: block; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    pre { background: #fff; border: 1px solid #e3ddd0; padding: 12px; margin: 0;
          overflow-x: auto; font-size: 13px; line-height: 1.45; }
    .note { color: #5b6660; font-size: 0.875rem; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Server Error (500)</h1>
    <p class="request">{{ method }} {{ path }}</p>
    <div class="error">
      <strong>{{ error_type }}</strong>
      {{ error_message }}
    </div>
    <h2>Traceback</h2>
    <pre>{{ traceback }}</pre>
    <p class="note">Only staff users see these details. Everyone else gets a plain error page.</p>
  </main>
</body>
</html>
